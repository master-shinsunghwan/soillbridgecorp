<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해피콜 대표 이미지</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#222;font-family:Arial,"Malgun Gothic",sans-serif}header{max-width:1000px;margin:auto;padding:28px 20px}.brand{color:#e60012;font-size:30px;font-weight:900}h1{font-size:25px}nav{display:flex;gap:10px;flex-wrap:wrap}button,a.download{font:inherit;border:1px solid #ccc;border-radius:8px;padding:12px 16px;background:white;cursor:pointer}button[aria-pressed=true],a.download{background:#222;color:white;border-color:#222}a.download{display:inline-block;text-decoration:none;margin-top:16px}main{max-width:1000px;margin:auto;background:white}img{display:block;width:100%;height:auto}p{color:#666;line-height:1.6}.links{margin-top:20px}.links a{color:#a9000d;margin-right:20px}</style></head><body><header><div class="brand">HC</div><h1>해피콜 대표 이미지</h1><p>4종 또는 5종을 선택한 뒤 원본 이미지를 다운로드하세요.</p><nav><button aria-pressed="true" onclick="choose(4)">4종 · 20+24+28+28</button><button aria-pressed="false" onclick="choose(5)">5종 · 20+24+28+24+28</button></nav><a class="download" id="download" href="assets/set4-main.jpg" download="happycall-set4-main.jpg">4종 원본 JPG 다운로드</a><div class="links"><a href="main.html">대표 이미지</a><a href="detail.html">상세페이지</a></div></header><main><img id="picture" src="assets/set4-main.jpg" alt="해피콜 4종 대표 이미지"></main><script>function choose(n){const path='assets/set'+n+'-main.jpg';document.getElementById('picture').src=path;document.getElementById('picture').alt='해피콜 '+n+'종 대표 이미지';const a=document.getElementById('download');a.href=path;a.download='happycall-set'+n+'-main.jpg';a.textContent=n+'종 원본 JPG 다운로드';document.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',i===(n===4?0:1)));}</script></body></html>
