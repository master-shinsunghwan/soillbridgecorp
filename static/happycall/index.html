<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해피콜 프라이팬 세트</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#252525;font-family:Arial,"Malgun Gothic",sans-serif}header{max-width:1000px;margin:auto;padding:42px 24px 24px}.brand{color:#e60012;font-size:32px;font-weight:900}h1{font-size:28px;margin:14px 0 10px}p{color:#666;line-height:1.6}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}button{border:1px solid #d5d5d5;background:white;border-radius:10px;padding:14px 20px;font:inherit;font-weight:bold;cursor:pointer}button[aria-pressed=true]{background:#222;color:white;border-color:#222}main{max-width:1000px;margin:0 auto 60px;background:white;border-radius:16px;overflow:hidden}img{display:block;width:100%;height:auto}.info{padding:24px;border-top:1px solid #eee;display:flex;justify-content:space-between;gap:16px;align-items:center}.info h2{font-size:20px;margin:0 0 8px}.info p{margin:0}a{color:#b60012}.detail{border-top:8px solid #f6f5f2}footer{text-align:center;padding:0 20px 32px}footer a{font-size:14px}@media(max-width:600px){header{padding:26px 16px 20px}h1{font-size:24px}main{border-radius:0}.info{padding:20px;align-items:flex-start;flex-direction:column}button{flex:1;padding:12px 10px}}
</style></head><body><header><div class="brand">HC</div><h1>해피콜 프라이팬 세트</h1><p>원하는 구성을 선택하고 상품 이미지를 확인하세요.</p><nav aria-label="세트 구성"><button aria-pressed="true" onclick="selectSet(4)">4종 · 20+24+28+28</button><button aria-pressed="false" onclick="selectSet(5)">5종 · 20+24+28+24+28</button></nav></header><main><img id="hero" src="assets/set4-main.jpg" alt="해피콜 4종 세트 대표 이미지"><div class="info"><div><h2 id="title">4종 세트</h2><p id="sizes">구성: 20 + 24 + 28 + 28</p></div><a href="#detail">상세 이미지 보기 ↓</a></div><div class="detail" id="detail"><img id="long" src="assets/set4-detail.jpg" alt="해피콜 4종 세트 상세 이미지" loading="lazy"></div></main><footer><a id="original" href="assets/set4-detail.jpg" target="_blank" rel="noopener">상세 이미지 원본 열기</a></footer><script>
function selectSet(n){document.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',i===(n===4?0:1)));document.getElementById('hero').src='assets/set'+n+'-main.jpg';document.getElementById('hero').alt='해피콜 '+n+'종 세트 대표 이미지';document.getElementById('long').src='assets/set'+n+'-detail.jpg';document.getElementById('long').alt='해피콜 '+n+'종 세트 상세 이미지';document.getElementById('original').href='assets/set'+n+'-detail.jpg';document.getElementById('title').textContent=n+'종 세트';document.getElementById('sizes').textContent='구성: '+(n===4?'20 + 24 + 28 + 28':'20 + 24 + 28 + 24 + 28');}
</script></body></html>
