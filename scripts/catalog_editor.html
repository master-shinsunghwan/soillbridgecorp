<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상품 제안서 · 품절 관리</title><style>
:root{font-family:Pretendard,Inter,"Malgun Gothic",sans-serif;color:#111827;background:#f5f7fb;font-size:14px}*{box-sizing:border-box}body{margin:0}main{padding:24px;max-width:1600px;margin:auto}h1{font-size:22px;margin:0 0 8px}p{line-height:1.6}button,input,select{font:inherit}a{color:inherit}.heading{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.heading p{color:#667085;margin:0}.link,button{border:1px solid #d5deeb;border-radius:8px;padding:10px 15px;background:white;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}.stat{border:1px solid #e3e8f2;border-radius:12px;background:white;padding:18px 22px;box-shadow:0 3px 10px #10285a04}.stat span{color:#667085}.stat strong{display:block;font-size:28px;margin-top:8px}.stat:nth-child(2) strong{color:#d97706}.stat:nth-child(3) strong{color:#2563eb}.panel{background:white;border:1px solid #e3e8f2;border-radius:12px;overflow:hidden}.toolbar{display:flex;gap:12px;padding:18px;border-bottom:1px solid #e3e8f2;flex-wrap:wrap}.toolbar input{flex:1;min-width:180px}.toolbar select{min-width:150px}input,select{padding:10px 12px;border:1px solid #d5deeb;border-radius:7px;background:white;color:#1f2937;width:100%;outline:none}input:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 3px #dbeafe}input:disabled{background:#f3f5f8;color:#98a2b3}input::placeholder{color:#98a2b3}.meta{padding:12px 18px;background:#f8faff;color:#667085;font-size:12px;display:flex;justify-content:space-between}.item{padding:20px;border-top:1px solid #e3e8f2;display:grid;grid-template-columns:minmax(220px,1fr) minmax(400px,1.8fr);gap:24px}.item:first-child{border-top:0}.item:hover{background:#fcfdff}.product-id{font-size:11px;letter-spacing:.05em;color:#667085}.item h2{font-size:14px;line-height:1.6;margin:6px 0 10px}.badge{display:inline-block;padding:4px 9px;border-radius:5px;background:#f0f3f8;font-size:11px;font-weight:700;color:#667085}.badge.temporary{background:#fff1d6;color:#a45d00}.badge.sold-out,.badge.discontinued{background:#fee4e2;color:#b42318}.badge.incoming,.badge.notice{background:#e7efff;color:#2459b8}.fields{display:grid;grid-template-columns:145px 1fr;gap:12px}label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#475467}.wide{grid-column:1/-1}.actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:12px}.save{background:#2563eb;border-color:#2563eb;color:white}.save:disabled{background:#f3f5f8;color:#98a2b3;border-color:#e3e8f2;cursor:default}.feedback{font-size:12px;color:#667085}.guide{color:#667085;font-size:12px;margin:16px 0}.empty{padding:50px;text-align:center;color:#667085}@media(max-width:760px){main{padding:14px}.heading{align-items:flex-start;flex-direction:column}.stats{gap:8px}.stat{padding:14px 10px}.stat strong{font-size:23px}.item{grid-template-columns:1fr;gap:12px}.fields{grid-template-columns:1fr}.wide{grid-column:auto}.meta{gap:10px}.heading h1{font-size:20px}}
</style></head><body><main><div class="heading"><div><h1>상품 상태 관리</h1><p>품절 상태와 재입고 일정을 거래처에 안내하세요.</p></div><a class="link" href="/catalog/" target="_blank" rel="noopener">상품 제안서 보기 ↗</a></div><div class="stats"><div class="stat"><span>전체 상품</span><strong id="total">—</strong></div><div class="stat"><span>일시 품절</span><strong id="temporary">—</strong></div><div class="stat"><span>안내 표시 중</span><strong id="marked">—</strong></div></div><section class="panel"><div class="toolbar"><input id="search" aria-label="상품 검색" placeholder="상품명 또는 상품 번호 검색"><select id="filter" aria-label="상태 필터" style="width:auto"><option value="all">모든 상태</option><option value="temporary">일시 품절</option><option value="sold-out">품절</option><option value="incoming">입고 예정</option><option value="discontinued">단종</option><option value="notice">상품 안내</option><option value="">표시 없음</option></select></div><div class="meta"><span id="status" role="status">불러오는 중…</span><span>상품별 변경 후 저장</span></div><div id="items"></div></section><p class="guide">일시 품절의 재입고 일정이 비어 있으면 ‘일정 미정’으로 안내됩니다. 저장한 상태는 제안서 새로고침 시 또는 최대 1분 안에 반영됩니다.</p></main><script>
let products=[],issues={},drafts={};const types=[['','표시 없음'],['temporary','일시 품절'],['sold-out','품절'],['incoming','입고 예정'],['discontinued','단종'],['notice','상품 안내']];
const el=(tag,text)=>{const e=document.createElement(tag);if(text)e.textContent=text;return e};
function stats(){document.querySelector('#total').textContent=products.length;document.querySelector('#temporary').textContent=Object.values(issues).filter(x=>x.type==='temporary').length;document.querySelector('#marked').textContent=Object.keys(issues).length}
function render(){const q=document.querySelector('#search').value.toLowerCase().replace(/\s/g,'');const filter=document.querySelector('#filter').value;const list=products.filter(p=>(p.id+p.name).toLowerCase().replace(/\s/g,'').includes(q)&&(filter==='all'||(issues[p.id]?.type||'')===filter));const box=document.querySelector('#items');box.replaceChildren();document.querySelector('#status').textContent='검색 결과 '+list.length+'개';stats();if(!list.length){const empty=el('div','검색 조건에 맞는 상품이 없습니다.');empty.className='empty';box.append(empty)}for(const p of list){const saved=issues[p.id]||{};const value=drafts[p.id]||saved;const row=el('section');row.className='item';const product=el('div');const id=el('span',p.id);id.className='product-id';const badge=el('span',types.find(t=>t[0]===(saved.type||''))[1]);badge.className='badge '+(saved.type||'');product.append(id,el('h2',p.name.replace(/\s*※.*?※/g,'')),badge);row.append(product);const editor=el('div');const fields=el('div');fields.className='fields';const type=el('select');type.setAttribute('aria-label',p.name+' 상태');for(const [v,t] of types){const o=el('option',t);o.value=v;type.append(o)}type.value=value.type||'';const restock=el('input');restock.value=value.restock||'';restock.maxLength=100;restock.placeholder='예: 9월 20일 예정 / 9월 말';const msg=el('input');msg.value=value.message||'';msg.maxLength=300;msg.placeholder='거래처에 보여줄 추가 안내';for(const [title,input,wide] of [['상품 상태',type],['재입고 예정',restock],['추가 안내 (선택)',msg,true]]){const label=el('label',title);if(wide)label.className='wide';label.append(input);fields.append(label)}const btn=el('button','저장');btn.className='save';btn.disabled=!drafts[p.id];const feedback=el('span',drafts[p.id]?'저장하지 않은 변경':'');feedback.className='feedback';feedback.setAttribute('role','status');const changed=()=>{restock.disabled=type.value!=='temporary';drafts[p.id]={type:type.value,restock:restock.value,message:msg.value};btn.disabled=false;feedback.textContent='저장하지 않은 변경'};type.addEventListener('change',changed);restock.addEventListener('input',changed);msg.addEventListener('input',changed);restock.disabled=type.value!=='temporary';btn.onclick=async()=>{btn.disabled=true;type.disabled=restock.disabled=msg.disabled=true;feedback.textContent='저장 중…';try{const response=await fetch('/api/catalog-status',{method:'POST',headers:{'Content-Type':'application/json','X-Workhub-Catalog':'1'},body:JSON.stringify({id:p.id,...drafts[p.id]})});const data=await response.json();if(!response.ok)throw Error(data.error||'저장 실패');issues=data.issues;delete drafts[p.id];badge.textContent=types.find(t=>t[0]===(issues[p.id]?.type||''))[1];badge.className='badge '+(issues[p.id]?.type||'');feedback.textContent='저장 완료';stats()}catch(e){feedback.textContent=e.message;btn.disabled=false}finally{type.disabled=msg.disabled=false;restock.disabled=type.value!=='temporary'}};const actions=el('div');actions.className='actions';actions.append(feedback,btn);editor.append(fields,actions);row.append(editor);box.append(row)}}
fetch('/api/catalog-status',{cache:'no-store'}).then(async r=>{const data=await r.json();if(!r.ok)throw Error(data.error||'불러오기 실패');products=data.products;issues=data.issues;render()}).catch(e=>document.querySelector('#status').textContent=e.message);document.querySelector('#search').addEventListener('input',render);document.querySelector('#filter').addEventListener('change',render);window.addEventListener('beforeunload',e=>{if(Object.keys(drafts).length){e.preventDefault();e.returnValue=''}});
</script></body></html>
